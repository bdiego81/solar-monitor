services:
  solar-monitor:
    image: bdiego81/solar-monitor:latest
    container_name: solar-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - TZ=America/Santiago
    volumes:
      - ./data:/home/appuser/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exi>
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
