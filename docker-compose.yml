services:
  solar2:
    image: bdiego81/solar-monitor:latest
    container_name: solar2
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - SHINEMONITOR_USERNAME=${SHINEMONITOR_USERNAME}
      - SHINEMONITOR_PASSWORD=${SHINEMONITOR_PASSWORD}
    volumes:
      - ./data:/home/appuser/app/data
      - ./config:/home/appuser/app/config
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s